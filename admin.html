<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Case admin - AI Driven Nutritional Tool and Simulation</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/styles.css?v=5">
  <link rel="stylesheet" href="css/premium.css?v=16">
  <link rel="stylesheet" href="css/mediception.css?v=6">
  <script src="js/theme.js?v=2"></script>
  <style>
    .adm{font-family:var(--f-lab);color:var(--ink-lab);padding-block:26px 60px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
    .adm h1{font-family:var(--f-lab-c);font-size:clamp(28px,3.2vw,40px);line-height:1.1;margin:6px 0 8px}
    .adm h2{font-family:var(--f-lab-c);font-size:19px;margin:0 0 14px}.adm h3{font-family:var(--f-lab-c);font-size:15px;margin:20px 0 8px}
    .adm-h{margin:8px 0 -6px!important}
    .adm-main{display:flex;flex-direction:column;gap:18px;min-width:0}
    .adm-card{border-radius:var(--g-r);padding:22px}
    .adm-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);border-radius:var(--g-r);padding:20px;max-height:calc(100vh - 104px);overflow:auto}
    .intro p{margin:0;max-width:64ch;color:var(--muted)}
    .start{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;margin-top:18px}
    .drop{display:grid;place-items:center;gap:6px;text-align:center;padding:26px 18px;border:2px dashed color-mix(in srgb,var(--lagoon) 55%,transparent);border-radius:18px;background:var(--g-fill-2);cursor:pointer;transition:background .2s,transform .2s}
    .drop:hover,.drop.over,.drop:focus-within{background:color-mix(in srgb,var(--lagoon) 12%,transparent);transform:translateY(-2px)}
    .drop b{font-size:16px}.drop span{font-size:13px;color:var(--muted)}.drop svg{width:44px;height:44px;color:var(--lagoon)}
    .start-r{display:flex;flex-direction:column;gap:10px;justify-content:center}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
    .f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2);min-width:0;border:0;margin:0;padding:0}.f.wide{grid-column:1/-1}
    .f em{font-style:normal;font-weight:400;color:var(--muted);margin-left:8px}
    .adm input:not([type=radio]):not([type=checkbox]):not([type=range]),.adm textarea,.adm select{font:500 14.5px var(--f-lab);color:var(--ink-lab);background:color-mix(in srgb,var(--paper) 70%,transparent);border:1px solid var(--g-edge);border-radius:12px;padding:10px 12px;width:100%;min-width:0;box-shadow:0 1px 0 rgba(255,255,255,.6) inset;transition:border-color .2s,box-shadow .2s}
    .adm textarea{resize:vertical;line-height:1.5}.adm textarea[data-json]{font-family:var(--f-lab-m);font-size:12.5px}
    .adm input:focus,.adm textarea:focus,.adm select:focus{outline:none;border-color:var(--lagoon);box-shadow:0 0 0 3px color-mix(in srgb,var(--lagoon) 25%,transparent)}
    .adm .bad{border-color:var(--tri-red)!important}
    .ck{display:flex;flex-wrap:wrap;gap:8px 18px}.ck legend{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px;padding:0}.ck label{display:flex;gap:7px;align-items:center;font-weight:500;color:var(--ink-lab)}
    .ck input,.opt-r input[type=radio]{width:17px;height:17px;accent-color:var(--lagoon)}
    .pair{display:grid;grid-template-columns:1fr 1.4fr;gap:6px}.pair.lk{grid-template-columns:1fr 2fr auto;margin-bottom:8px}
    .scene-wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(220px,1fr);gap:18px;align-items:stretch}
    .scene-view{position:relative;min-height:380px;border-radius:18px;background:linear-gradient(180deg,color-mix(in srgb,var(--stage-top) 50%,transparent),color-mix(in srgb,var(--stage-bot) 60%,transparent));border:1px solid var(--g-brd);overflow:hidden;color:var(--ink-lab)}
    .sl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}.sl label{display:grid;gap:2px;font-size:13px;font-weight:600;color:var(--ink-2)}.sl span{display:flex;justify-content:space-between}.sl b{font-family:var(--f-lab-m);font-weight:500}
    .sl input{accent-color:var(--lagoon);width:100%}
    .step summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px}.step summary::-webkit-details-marker{display:none}
    .step summary b{font-family:var(--f-lab-c);font-size:18px}.step summary span{flex:1;color:var(--muted);font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .step[open] summary{margin-bottom:16px}
    .opts{border:1px solid var(--g-edge);border-radius:16px;padding:14px;margin:14px 0;display:grid;gap:10px}.opts legend{font-size:13px;font-weight:600;color:var(--ink-2);padding:0 6px}
    .opt-r{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start}.opt-r>div{display:grid;gap:6px}.opt-r input[type=radio]{margin-top:11px}
    .x{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--lagoon-ink);padding:4px 8px;border-radius:8px}.x:hover{background:color-mix(in srgb,var(--lagoon) 12%,transparent)}.x[disabled]{opacity:.4;cursor:default}.x:focus-visible{outline:2px solid var(--lagoon)}
    .adm .act{border:0;font:600 14.5px var(--f-lab);box-sizing:border-box;cursor:pointer;display:inline-flex;justify-content:center;text-align:center}.adm .act[disabled]{opacity:.45;cursor:not-allowed;transform:none}.adm .act:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}
    .adm-hint{font-size:12.5px;color:var(--muted);margin:10px 0}.adm-hint code{font-family:var(--f-lab-m);font-size:12px;background:var(--g-fill-2);padding:1px 5px;border-radius:5px}
    .status{display:grid;gap:2px;padding:14px 16px;border-radius:16px;margin-bottom:12px}.status.ok{background:color-mix(in srgb,var(--tri-green) 14%,transparent)}.status.bad{background:color-mix(in srgb,var(--tri-amber) 16%,transparent)}
    .status b{font-family:var(--f-lab-c);font-size:18px}.status span{font-size:13px;color:var(--muted)}
    .chk{margin:0 0 12px;padding-left:18px;font-size:13px;line-height:1.5}.chk.bad li::marker{color:var(--tri-red)}.chk.warn{color:var(--muted)}.chk.warn li::marker{color:var(--tri-amber)}
    .btns{display:grid;gap:8px}
    .pubs{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}.pubs li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--g-fill-2)}.pubs li.off{opacity:.5;text-decoration:line-through}.pubs em{display:block;font-style:normal;color:var(--muted);font-size:12px}.pubs span:last-child{white-space:nowrap}
    .note{padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--tri-green) 14%,transparent);font-size:14px;margin-top:12px}.note.bad{background:color-mix(in srgb,var(--tri-red) 12%,transparent)}
    .adm-lock{font-size:12.5px;color:var(--muted);margin-top:14px}
    @media (max-width:1040px){.adm{grid-template-columns:1fr}.adm-side{position:static;max-height:none}}
    @media (max-width:680px){.grid2,.grid3,.start,.scene-wrap,.sl{grid-template-columns:1fr}.pair.lk{grid-template-columns:1fr}}
    /* sign-in (js/admin-gate.js) */
    .adm.gate{grid-template-columns:minmax(0,440px);justify-content:center;padding-block:clamp(32px,10vh,110px) 80px}
    .gate[hidden],.gate-err[hidden],#signOut[hidden]{display:none}
    .gate-card{padding:30px 30px 28px}
    .gate-card h1{margin:4px 0 6px}
    .gate-card>p{margin:0 0 20px;color:var(--ink-2)}
    .gate-card fieldset{border:0;margin:0;padding:0;min-width:0;display:grid;gap:16px}
    .gate-card .act{width:100%;padding:13px 20px}
    .gate-err{margin:16px 0 0;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--tri-red) 14%,transparent);color:var(--ink);font-size:14px}
    .gate-card .adm-lock{margin:18px 0 0}
  </style>
</head>

<!-- Sign-in. The admin panel itself is in the encrypted block below and opens only with the admin email and password
     (js/admin-gate.js). To set or change them, run build-admin.mjs in the admin-source folder next to this site. -->
<div class="wrap adm gate" id="gate" hidden>
  <form class="adm-card gate-card" id="gateForm">
    <p class="lab-k">Case admin · Mediception team</p>
    <h1>Sign in</h1>
    <p>Sign in with the admin email and password to open the case admin.</p>
    <fieldset>
      <label class="f">Email<input type="email" id="gateId" name="username" autocomplete="username" inputmode="email" spellcheck="false" required></label>
      <label class="f">Password<input type="password" id="gatePw" name="password" autocomplete="current-password" required></label>
      <button type="submit" class="act" id="gateGo">Sign in</button>
    </fieldset>
    <p class="gate-err" id="gateErr" role="alert" hidden></p>
    <p class="adm-lock">You stay signed in on this tab until you close it or sign out.</p>
  </form>
</div>
